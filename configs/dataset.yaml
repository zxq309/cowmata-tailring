# Machine-readable dataset contract for the 20260819 baseline.
name: cowmata_imu
root: datasets/cowmata_imu

signal:
  sample_rate_hz: 50
  decision_hz: 2
  cache_schema_version: 2          # int16 counts; schema 1 still readable
  cache_channels: 9                # acc xyz, gyro xyz, mag xyz (raw counts)
  bytes_per_frame: 18              # was 52 under schema 1
  timestamp_rule: "start_ms + 20 * (index - segment.start_index)"
  quality_flag: sparse_intervals

features:
  version: 2                       # 120 columns; version 1 is the deployed 104
  orientation_self_calibration: true
  amplitude_self_calibration: true
  rotation_invariants: [acc_dot_gyro, acc_cross_gyro]

labels:
  states: [STANDING, LYING, WALKING, FEEDING]     # FEEDING readable, folded to UPRIGHT
  events: [STANDING_UP, LYING_DOWN, URINATION, DEFECATION, TAIL_RAISED, MOUNTING, MOUNTED_BY]
  deprecated_events: [TAIL_WAGGING]
  day_level: [ESTRUS, CALVING]
  tail_raised_policy: derive

paths:
  annotations: annotations/annotations_adjudicated_minimal.csv
  review_coverage: annotations/review_coverage_template.csv
  supervised_samples: supervised_cache/samples.csv
  supervised_sessions: supervised_cache/sessions.csv
  supervised_cache: supervised_cache/session_cache

splits:
  unit: cow_id
  protocol: grouped_kfold          # strict_loco is the limiting case
  folds: 5
  validation: cow_disjoint         # not merely session-disjoint

metadata_required_per_session:
  - cow_id
  - device_mac
  - session_id
  - tail_position                  # root | mid | tip | unknown
  - calibration                    # divisors and biases, applied on read
